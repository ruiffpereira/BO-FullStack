<title>Construtor de Páginas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: shell do Backoffice — barra de topo · lista de páginas | pilha de blocos | formulário do bloco */
:root{
  --bg:#f4f4f5; --surface:#ffffff; --surface-2:#fafafa; --border:#e4e4e7; --border-strong:#d4d4d8;
  --text:#18181b; --text-2:#3f3f46; --muted:#71717a; --faint:#a1a1aa;
  --accent:#2a6fdb; --accent-soft:rgba(42,111,219,.09); --accent-ring:rgba(42,111,219,.25); --on-accent:#ffffff;
  --warn-bg:#fef3c7; --warn-fg:#92400e; --warn-line:#f59e0b;
  --ok-bg:#dcfce7; --ok-fg:#166534; --ok-dot:#22c55e;
  --draft-bg:#f4f4f5; --draft-fg:#52525b; --danger:#dc2626; --danger-soft:rgba(220,38,38,.08);
  --th-bg:#f1f5f9; --th-ink:#cbd5e1; --th-ink-2:#94a3b8; --th-brand:#19a3e0; --th-dark:#0f2233;
  --scrim:rgba(9,9,11,.42);
  --shadow:0 1px 2px rgba(24,24,27,.05),0 8px 24px rgba(24,24,27,.08);
  --font:'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09090b; --surface:#18181b; --surface-2:#1f1f23; --border:#27272a; --border-strong:#3f3f46;
    --text:#f4f4f5; --text-2:#d4d4d8; --muted:#a1a1aa; --faint:#71717a;
    --accent:#4c86f0; --accent-soft:rgba(76,134,240,.13); --accent-ring:rgba(76,134,240,.32); --on-accent:#ffffff;
    --warn-bg:rgba(245,158,11,.14); --warn-fg:#fcd34d; --warn-line:#f59e0b;
    --ok-bg:rgba(34,197,94,.14); --ok-fg:#86efac; --ok-dot:#22c55e;
    --draft-bg:#27272a; --draft-fg:#d4d4d8; --danger:#f87171; --danger-soft:rgba(248,113,113,.1);
    --th-bg:#1e293b; --th-ink:#334155; --th-ink-2:#475569; --th-brand:#38bdf8; --th-dark:#0b1520;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09090b; --surface:#18181b; --surface-2:#1f1f23; --border:#27272a; --border-strong:#3f3f46;
  --text:#f4f4f5; --text-2:#d4d4d8; --muted:#a1a1aa; --faint:#71717a;
  --accent:#4c86f0; --accent-soft:rgba(76,134,240,.13); --accent-ring:rgba(76,134,240,.32); --on-accent:#ffffff;
  --warn-bg:rgba(245,158,11,.14); --warn-fg:#fcd34d; --warn-line:#f59e0b;
  --ok-bg:rgba(34,197,94,.14); --ok-fg:#86efac; --ok-dot:#22c55e;
  --draft-bg:#27272a; --draft-fg:#d4d4d8; --danger:#f87171; --danger-soft:rgba(248,113,113,.1);
  --th-bg:#1e293b; --th-ink:#334155; --th-ink-2:#475569; --th-brand:#38bdf8; --th-dark:#0b1520;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.faint{color:var(--faint)}

.shell{display:flex;flex-direction:column;height:100%}
.note{display:flex;align-items:center;justify-content:center;gap:10px;padding:7px 16px;background:var(--accent-soft);color:var(--text-2);font-size:12.5px;text-align:center}
.note button{color:var(--muted);padding:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;flex:none;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.crumbs{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--text);font-weight:600}
.spacer{flex:1}
.lang{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:2px}
.seg button{position:relative;padding:4px 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg .dot{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--warn-line)}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok-dot)}
.status.dirty i{background:var(--warn-line)}
.status.pub i{background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;padding:7px 14px;font-weight:600;font-size:13px;border:1px solid var(--border);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn svg{width:15px;height:15px}

.app{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) 440px}
.side{order:1;background:var(--surface);border-right:1px solid var(--border);overflow:auto;padding:12px 10px 24px}
.edit{order:2;background:var(--surface);overflow:auto;display:flex;flex-direction:column}
.edit .eb{width:100%;max-width:760px;align-self:center}
.main{order:3;overflow:auto;padding:20px 16px 96px;border-left:1px solid var(--border)}
.main .ph h1{font-size:20px}
.scrim{display:none}

.grp-h{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 6px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.grp-h button{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--accent);padding:3px 6px;border-radius:6px}
.grp-h button:hover{background:var(--accent-soft)}
.grp-h button svg{width:13px;height:13px}
.pg{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:8px}
.pg:hover{background:var(--surface-2)}
.pg[aria-current="true"]{background:var(--accent-soft)}
.pg[aria-current="true"] .t{color:var(--accent)}
.pg .tx{flex:1;min-width:0}
.pg .t{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg .p{display:block;font-size:11.5px;color:var(--faint);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-tip{margin:6px 10px 0;font-size:12px;color:var(--faint);line-height:1.4}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap;letter-spacing:0;text-transform:none}
.b-draft{background:var(--draft-bg);color:var(--draft-fg)}
.b-pub{background:var(--ok-bg);color:var(--ok-fg)}
.b-warn{background:var(--warn-bg);color:var(--warn-fg)}
.b-hid{background:var(--draft-bg);color:var(--muted)}

.ph{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;max-width:780px}
.ph .tt{flex:1;min-width:0}
.ph h1{margin:0;font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.ph .sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--muted)}
.ph .sub code{font-family:var(--mono);font-size:12.5px}
.back{display:none;align-items:center;gap:4px;margin:-4px 0 10px -4px;padding:4px;color:var(--muted);font-size:13px;font-weight:600}
.back svg{width:16px;height:16px}
.hint{max-width:780px;margin:14px 0 14px;font-size:12.5px;color:var(--faint)}

.stack{max-width:780px}
.card{position:relative;display:flex;align-items:center;gap:14px;padding:10px 10px 10px 4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.card:hover{border-color:var(--border-strong)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.card.hid .thumb,.card.hid .cbody{opacity:.5}
.cbody{flex:1;min-width:0}
.ctype{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.csum{margin-top:3px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csum.empty{color:var(--faint);font-style:italic;font-weight:400}
.cmeta{margin-top:1px;font-size:12px;color:var(--faint)}
.cact{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.card:hover .cact,.card.sel .cact,.card:focus-within .cact{opacity:1}
@media (hover:none){.cact{opacity:1}}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--surface-2);color:var(--text)}
.ib:disabled{opacity:.3;cursor:default;background:none}
.ib svg{width:16px;height:16px}
.menu{position:absolute;right:8px;top:calc(100% - 6px);z-index:20;min-width:200px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);cursor:default}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:7px;text-align:left;font-size:13px}
.menu button:hover{background:var(--surface-2)}
.menu button svg{width:15px;height:15px;color:var(--muted)}
.menu .danger,.menu .danger svg{color:var(--danger)}
.menu .cf{padding:8px 10px 4px;font-size:13px;color:var(--text-2)}
.menu .cf-row{display:flex;gap:6px;padding:6px 6px 4px}

.ins{position:relative;height:24px;display:flex;align-items:center;justify-content:center}
.ins::before{content:"";position:absolute;left:14px;right:14px;top:50%;height:1px;background:var(--accent);opacity:0;transition:opacity .12s}
.ins button{position:relative;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--muted);opacity:0;transition:opacity .12s,transform .12s}
.ins button svg{width:13px;height:13px}
.ins:hover::before,.ins:focus-within::before{opacity:.45}
.ins:hover button,.ins button:focus-visible{opacity:1}
.ins button:hover{border-color:var(--accent);color:var(--accent);transform:scale(1.08)}
@media (hover:none){.ins button{opacity:.8}}
.addend{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:14px;border:1.5px dashed var(--border-strong);border-radius:12px;color:var(--muted);font-weight:600}
.addend:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.addend svg{width:16px;height:16px}
.emptybox{max-width:780px;padding:40px 24px;text-align:center;border:1.5px dashed var(--border-strong);border-radius:14px;color:var(--muted)}
.emptybox p{margin:0 0 14px}

/* miniaturas: um esboço de cada componente */
.thumb{flex:0 0 96px;width:96px;height:60px;display:flex;align-items:center;gap:4px;padding:6px;border-radius:7px;background:var(--th-bg);border:1px solid var(--border);overflow:hidden}
.thumb i{display:block;flex:none}
.thumb .l{height:3px;border-radius:2px;background:var(--th-ink)}
.thumb .h{height:5px;border-radius:2px;background:var(--th-ink-2)}
.thumb .a{background:var(--th-brand)}
.thumb .im{border-radius:3px;background:var(--th-ink);align-self:stretch}
.thumb .pill{width:16px;height:6px;border-radius:3px;background:var(--th-brand)}
.thumb .pill.o{background:transparent;border:1px solid var(--th-ink-2)}
.thumb .sq{width:7px;height:7px;border-radius:2px}
.thumb .fi{width:100%;height:7px;border-radius:2px;border:1px solid var(--th-ink-2)}
.thumb .row{display:flex;gap:4px;min-width:0}
.thumb .col{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.tpl .thumb{flex:none;width:100%;height:86px;padding:9px;gap:6px}
.tpl .thumb .l{height:4px}.tpl .thumb .h{height:7px}.tpl .thumb .pill{width:24px;height:8px}

.e-empty{margin:auto;padding:32px;text-align:center;color:var(--muted);max-width:300px}
.e-empty h2{margin:12px 0 6px;font-size:15px;color:var(--text)}
.e-empty p{margin:0;font-size:13px;line-height:1.5}
.e-empty svg{width:36px;height:36px;margin:0 auto;color:var(--faint)}
.eh{position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;gap:12px;padding:16px 16px 14px 18px;background:var(--surface);border-bottom:1px solid var(--border)}
.eh .thumb{flex-basis:64px;width:64px;height:42px;padding:4px;gap:3px}
.eh .tx{flex:1;min-width:0}
.eh h2{margin:0;font-size:16px;font-weight:700}
.eh p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.eh .gear{width:42px;height:42px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--bg);color:var(--muted)}
.eh .gear svg{width:20px;height:20px}
.eb{display:flex;flex-direction:column;gap:18px;padding:18px 18px 28px}
.ef{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;margin-top:auto;background:var(--surface);border-top:1px solid var(--border)}
.ef .grow{flex:1}
.ef .cf{flex:1;min-width:0;font-size:13px;color:var(--text-2)}
.f .lb{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--text-2)}
.f .loc{font-size:11px;font-weight:600;color:var(--faint);white-space:nowrap}
.f .loc.miss{color:var(--warn-fg)}
.in{display:block;width:100%;padding:8px 11px;font-size:14px;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;transition:border-color .12s,box-shadow .12s}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.in.miss{border-style:dashed;border-color:var(--warn-line);background:var(--warn-bg)}
.in::placeholder{color:var(--faint)}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
select.in{appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.fh{margin-top:5px;font-size:12px;color:var(--faint)}
.tb{display:flex;gap:2px;margin-bottom:5px}
.tb button{min-width:28px;height:26px;padding:0 7px;border-radius:6px;font-size:12.5px;color:var(--muted);border:1px solid transparent}
.tb button:hover{background:var(--surface-2);border-color:var(--border)}
.box{display:flex;flex-direction:column;gap:12px;padding:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px}
.prefix{display:flex;align-items:stretch}
.prefix span{display:flex;align-items:center;padding:0 10px;font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--border-strong);border-right:0;border-radius:8px 0 0 8px;white-space:nowrap}
.prefix .in{border-radius:0 8px 8px 0;font-family:var(--mono);font-size:13px;min-width:0}
.list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.li{background:var(--surface);border:1px solid var(--border);border-radius:9px}
.li-h{display:flex;align-items:center;gap:2px;padding:4px 4px 4px 6px}
.li-h .n{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:5px 4px;text-align:left;font-size:13.5px;font-weight:500}
.li-h .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-h .n svg{width:14px;height:14px;flex:none;color:var(--faint);transition:transform .15s}
.li-h .n[aria-expanded="true"] svg{transform:rotate(90deg)}
.li-h .ib{width:28px;height:28px}
.li-h .ib svg{width:15px;height:15px}
.li-b{display:flex;flex-direction:column;gap:12px;padding:12px;border-top:1px solid var(--border)}
.media{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface)}
.media .pv{width:64px;height:44px;flex:none;border-radius:6px;background:repeating-linear-gradient(135deg,var(--th-bg),var(--th-bg) 6px,var(--th-ink) 6px,var(--th-ink) 7px)}
.media .pdf{width:40px;height:44px;flex:none;border-radius:6px;display:grid;place-items:center;background:var(--danger-soft);color:var(--danger);font-size:10px;font-weight:700}
.media .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media .nm small{display:block;color:var(--faint);font-size:11.5px}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;cursor:pointer;background:var(--surface)}
.checks label:hover{border-color:var(--border-strong)}
.checks input{width:16px;height:16px;accent-color:var(--accent)}
.checks .tx{flex:1;min-width:0;font-size:13.5px}
.checks small{display:block;color:var(--faint);font-size:11.5px}
.anchor{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:9px;background:var(--bg);font-size:12.5px;color:var(--muted)}
.anchor code{font-family:var(--mono);color:var(--text-2)}
.anchor svg{width:15px;height:15px;flex:none}

.ov{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--scrim)}
.modal{display:flex;flex-direction:column;width:min(820px,100%);max-height:88vh;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);animation:pop .18s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
.mh{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.mh .tx{flex:1}
.mh h3{margin:0;font-size:16px}
.mh p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:16px 20px 20px;overflow:auto}
.mg-h{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px}
.mg-h:first-child{margin-top:0}
.mg-h b{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.mg-h span{font-size:12.5px;color:var(--faint)}
.tpl{display:flex;flex-direction:column;gap:8px;padding:10px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;transition:border-color .12s,box-shadow .12s}
.tpl:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.tpl b{font-size:13.5px}
.tpl span{font-size:12px;line-height:1.35;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);padding:10px 16px;border-radius:10px;background:var(--text);color:var(--bg);font-size:13px;font-weight:500;box-shadow:var(--shadow);animation:pop .18s ease}
.toast svg{width:16px;height:16px;flex:none}

.tri{display:flex;flex-direction:column;gap:6px}
.tri-row{display:flex;align-items:flex-start;gap:8px}
.tri-row .in{flex:1;min-width:0}

function seoReport(p){

  out.push(!desc ? {ok: false, t: 'Falta a descrição para o Google.'} : desc.length > 160 ? {ok: false, t: 'A descrição tem ' + desc.length + ' caracteres; o Google corta a partir de 160.'} : desc.length < 70 ? {ok: false, t: 'A descrição é curta (' + desc.length + ' caracteres). Entre 70 e 160 é o ideal.'} : {ok: true, t: 'Descrição com ' + desc.length + ' caracteres.'});

    const yes = places.filter(x => fold(x[1]).indexOf(k) >= 0).map(x => x[0]), no = places.filter(x => fold(x[1]).indexOf(k) < 0).map(x => x[0]);
    out.push(no.length ? {ok: false, t: '«' + kw + '» falta ' + no.join(', ') + (yes.length ? ' (já está ' + yes.join(', ') + ')' : '') + '.'} : {ok: true, t: '«' + kw + '» está no título, no H1, na descrição, no endereço e no primeiro parágrafo.'});

  out.push(noAlt.length ? {ok: false, t: noAlt.length + ' imagem' + (noAlt.length > 1 ? 'ns' : '') + ' sem descrição (' + noAlt.map(x => x.b.name).join(', ') + ').'} : {ok: true, t: 'Todas as imagens têm descrição.'});
  /* ligações */
  const inner = destsIn(found).filter(d => /^(p|a):/.test(d.to) && d.to !== 'p:' + p.id);
  out.push(inner.length ? {ok: true, t: inner.length + ' ligaç' + (inner.length > 1 ? 'ões' : 'ão') + ' para outras páginas ou secções do site.'} : {ok: false, t: 'Não liga a nenhuma outra página. Junte um botão para páginas relacionadas: ajuda o Google a percorrer o site.'});
  const all = destsIn(found.concat(SITE.topo.comps.map(c => ({b: SITE.topo, c: c})), SITE.rodape.comps.map(c => ({b: SITE.rodape, c: c}))));

  if (drafts.length) out.push({ok: false, t: 'Liga para «' + ptitle(pg(drafts[0].to.slice(2))) + '», que está em rascunho: no site essa ligação não funciona.'});

}

/* Desfazer / refazer: uma fotografia dos dados por alteração. Escrever seguido no mesmo campo conta como uma. */
const H = {stack: [], i: -1, saved: 0, lastKey: null, lastAt: 0};
const snap = () => JSON.stringify({p: PAGES, l: LIB, s: SITE, f: FOLDERS});
function record(key){
  const now = Date.now(), s = snap();
  if (key && key === H.lastKey && now - H.lastAt < 1500 && H.i > H.saved) H.stack[H.i] = s;
  else {
    H.stack.splice(H.i + 1); H.stack.push(s); H.i++;
    if (H.stack.length > 200){ H.stack.shift(); H.i--; H.saved--; }
  }
  H.lastKey = key || null; H.lastAt = now;
}
function restore(s){
  const o = JSON.parse(s);
  PAGES.splice(0, PAGES.length, ...o.p); LIB.splice(0, LIB.length, ...o.l); FOLDERS.splice(0, FOLDERS.length, ...o.f);
  SITE.topo = o.s.topo; SITE.rodape = o.s.rodape;
}
function afterRestore(msg){
  H.lastKey = null;
  if (!pg(state.pageId)) state.pageId = 'home';
  if (state.libId && !blk(state.libId)) state.libId = null;
  const s = state.sel;
  if (s && !s.page && !s.part && (!blk(s.id) || (s.ref && !cur().items.some(r => r.key === s.ref)))) state.sel = null;
  if (state.copen && !findComp(state.copen)) state.copen = null;
  Object.assign(state, {menu: null, confirm: null, cconfirm: null, renaming: null, status: H.i === H.saved ? 'live' : 'dirty'});
  renderAll(); toast(msg);
}
function undo(){ if (H.i <= 0) return; H.i--; restore(H.stack[H.i]); afterRestore('Desfeito.'); }
function redo(){ if (H.i >= H.stack.length - 1) return; H.i++; restore(H.stack[H.i]); afterRestore('Refeito.'); }
function dirty(key){
  state.status = 'dirty'; record(key); renderTop();
  const a = document.activeElement; if (!(a && a.closest && a.closest('#side'))) renderSide();
}
function reId(v, pre){
  if (Array.isArray(v)) return v.map(x => reId(x, pre));
  if (v && typeof v === 'object'){ const o = {}; Object.keys(v).forEach(k => { o[k] = (k === '_id' || (k === 'id' && pre)) ? nid(pre || 'i') : reId(v[k], k === 'comps' ? 'c' : pre === 'c' ? null : pre); }); return o; }
  return v;
}
function cloneComp(c){ const o = JSON.parse(JSON.stringify(c)); o.id = nid('c'); o.v = reId(o.v); return o; }
function copyBlock(b){ const c = {id: nid('b'), name: b.name + ' (cópia)', layout: b.layout, bg: b.bg, folderId: b.folderId, comps: b.comps.map(cloneComp)}; LIB.splice(LIB.indexOf(b) + 1, 0, c); return c; }
function getParent(o, path){ for (let i = 0; i < path.length - 1; i++) o = o[path[i]]; return o; }
const refByKey = k => cur().items.find(r => r.key === k);
function slug(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9/]+/g, '-').replace(/\/+/g, '/').replace(/^-|-$/g, ''); }
function uniqPath(base){ let p = base, n = 2; while (PAGES.some(x => x.path === p)) p = base + '-' + (n++); return p; }

const ACT = {

  back: () => { state.view = 'pages'; state.sel = null; renderAll(); },
  part: el => { Object.assign(state, {sel: {part: el.dataset.part}, libId: null, menu: null, confirm: null, copen: null, view: 'page'}); renderAll(); $('#edit').scrollTop = 0; },
  ptoggle: el => { const id = el.dataset.id; state.pcollapsed[id] = !state.pcollapsed[id]; renderSide(); },

    if (t.checked && i < 0) arr.push(t.dataset.pick); if (!t.checked && i >= 0) arr.splice(i, 1); dirty(); refreshBlock();
  }
});

/* arrastar: blocos na página e componentes no bloco (rato); no telemóvel ficam as setas */
let drag = null, dropAt = null;
const dragId = el => ({block: el.dataset.key, group: el.dataset.gid, page: el.dataset.pid, lib: el.dataset.bid, folder: el.dataset.fid,
  item: el.dataset.cid + '|' + el.dataset.path + '|' + el.dataset.i})[el.dataset.drag] || el.dataset.cid;
document.addEventListener('pointerdown', e => { const g = e.target.closest('[data-grip]'); if (g) g.closest('[data-drag]').setAttribute('draggable', 'true'); });
document.addEventListener('dragstart', e => {
  const el = e.target.closest && e.target.closest('[data-drag]'); if (!el) return;
  e.stopPropagation();
  dropAt = null;
  drag = {kind: el.dataset.drag, id: dragId(el), cid: el.dataset.cid, path: el.dataset.path, i: +el.dataset.i}; el.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', drag.id); } catch (_) {}
});
function clearDrop(){ document.querySelectorAll('.drop-before,.drop-after,.drop-in').forEach(x => x.classList.remove('drop-before', 'drop-after', 'drop-in')); }
document.addEventListener('dragover', e => {
  if (!drag) return;
  const sel = drag.kind === 'lib' ? '[data-drag="lib"],[data-drag="folder"]' : '[data-drag="' + drag.kind + '"]';
  const el = e.target.closest && e.target.closest(sel);
  if (!el || (el.dataset.drag === drag.kind && dragId(el) === drag.id)) return;
  if (drag.kind === 'item' && (el.dataset.cid !== drag.cid || el.dataset.path !== drag.path)) return;
  const r = el.getBoundingClientRect(), ratio = (e.clientY - r.top) / (r.height || 1);
  let zone = ratio > .5 ? 'after' : 'before';
  if (drag.kind === 'page'){
    const tp = pg(el.dataset.pid), dp = pg(drag.id);
    if (isDesc(tp, dp)){ dropAt = null; clearDrop(); return; }   /* não se mete uma página dentro de uma filha dela */
    zone = ratio < .28 ? 'before' : ratio > .72 ? 'after' : 'in';
    if (zone === 'in' && (tp.id === 'home' || dp.id === 'home')) zone = ratio > .5 ? 'after' : 'before';
    if (dp.id === 'home' && zone !== 'in' && tp.parentId){ dropAt = null; clearDrop(); return; }   /* a página inicial fica sempre no primeiro nível */
  }
  if (drag.kind === 'lib' && el.dataset.drag === 'folder') zone = 'in';
  e.preventDefault();
  if (dropAt && dropAt.id === dragId(el) && dropAt.zone === zone && dropAt.kind === el.dataset.drag) return;
  clearDrop(); el.classList.add('drop-' + zone);
  dropAt = {id: dragId(el), zone: zone, after: zone === 'after', kind: el.dataset.drag, i: +el.dataset.i};
});
document.addEventListener('drop', e => {
  if (!drag || !dropAt) return; e.preventDefault();
  try { applyDrop(); } finally { finishDrag(); }
});
function applyDrop(){
  if (drag.kind === 'page'){
    const p = pg(drag.id), t = pg(dropAt.id), snap = pathSnap();
    PAGES.splice(PAGES.indexOf(p), 1);
    if (dropAt.zone === 'in'){ p.parentId = t.id; const sib = kids(t.id), last = sib.length ? sib[sib.length - 1] : t; PAGES.splice(PAGES.indexOf(last) + 1, 0, p); state.pcollapsed[t.id] = false; }
    else { p.parentId = t.parentId || null; const i = PAGES.indexOf(t); PAGES.splice(dropAt.zone === 'after' ? i + 1 : i, 0, p); }
    recomputePaths(p); applyRedirects(snap); dirty();
    toast(dropAt.zone === 'in' ? '«' + ptitle(p) + '» está agora dentro de «' + ptitle(t) + '» (' + p.path + ').' : 'Ordem das páginas actualizada.');
    return;
  }
  if (drag.kind === 'lib'){
    const b = blk(drag.id); LIB.splice(LIB.indexOf(b), 1);
    if (dropAt.kind === 'folder'){ b.folderId = dropAt.id; LIB.push(b); state.fcollapsed[dropAt.id] = false; }
    else { const t = blk(dropAt.id); b.folderId = t.folderId || null; const i = LIB.indexOf(t); LIB.splice(dropAt.zone === 'after' ? i + 1 : i, 0, b); }
    dirty(); return;
  }
  if (drag.kind === 'folder'){
    const f = FOLDERS.find(x => x.id === drag.id); FOLDERS.splice(FOLDERS.indexOf(f), 1);
    const i = FOLDERS.findIndex(x => x.id === dropAt.id); FOLDERS.splice(dropAt.zone === 'after' ? i + 1 : i, 0, f);
    dirty(); return;
  }
  if (drag.kind === 'group'){
    const g = state.groups; g.splice(g.indexOf(drag.id), 1);
    const to = g.indexOf(dropAt.id); g.splice(dropAt.after ? to + 1 : to, 0, drag.id); saveSidebar(); return;
  }
  if (drag.kind === 'item'){
    const fc = findComp(drag.cid), path = JSON.parse(drag.path), list = getParent(fc.c.v, path)[path[path.length - 1]];
    const [m] = list.splice(drag.i, 1); let to = dropAt.i; if (drag.i < to) to--;
    list.splice(dropAt.after ? to + 1 : to, 0, m);
    Object.keys(state.open).forEach(k => { if (k.indexOf(drag.cid + ':' + path.join('.') + '.') === 0) delete state.open[k]; });
    dirty(); return;
  }
  const arr = drag.kind === 'block' ? cur().items : selBlock().comps, key = drag.kind === 'block' ? 'key' : 'id';
  const [m] = arr.splice(arr.findIndex(x => x[key] === drag.id), 1), to = arr.findIndex(x => x[key] === dropAt.id);
  arr.splice(dropAt.after ? to + 1 : to, 0, m); dirty();
}
function finishDrag(){
  drag = null; dropAt = null; clearDrop();
  document.querySelectorAll('[data-drag][draggable]').forEach(c => c.removeAttribute('draggable'));
  renderSide(); renderMain(); renderEdit();
}
document.addEventListener('dragend', () => { if (drag) finishDrag(); });

H.stack = [snap()]; H.i = 0; H.saved = 0;
renderAll();
})();

</script>
